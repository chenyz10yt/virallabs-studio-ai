name: Compilar APK ViralLabs Studio AI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias y Capacitor Android
        run: |
          npm install
          npx cap add android
          npx cap copy android
          npx cap sync android
          cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -d "android_config/res" ]; then
            cp -rf android_config/res/* android/app/src/main/res/
          fi

      - name: Compilar archivo APK binario
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK para descarga directa
        uses: actions/upload-artifact@v4
        with:
          name: ViralLabsStudioAI-Instalador-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk